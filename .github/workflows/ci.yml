name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
          POSTGRES_DB: trader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trader -d trader"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check app/ tests/

      - name: Check formatting
        run: uv run ruff format --check app/ tests/

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://trader:trader@localhost:5432/trader
        run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (eslint + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Postgres
        run: |
          # The app now requires DATABASE_URL and refuses to start without
          # it, so this job needs a real Postgres reachable from the trader
          # container. A `services:` container (as the backend job uses)
          # is published on the *runner's* localhost network namespace;
          # trader-ci below is a plain `docker run` container on Docker's
          # bridge network, where localhost means itself, not the runner.
          # So instead: a user-defined network, Postgres on it under a
          # known name, and the app addresses that name directly.
          docker network create trader-ci-net
          docker run -d --name trader-ci-db --network trader-ci-net \
            -e POSTGRES_USER=trader -e POSTGRES_PASSWORD=trader -e POSTGRES_DB=trader \
            postgres:16-alpine

          for _ in $(seq 1 30); do
            if docker exec trader-ci-db pg_isready -U trader -d trader >/dev/null 2>&1; then
              echo "Postgres is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Postgres never became ready. Logs:" >&2
          docker logs trader-ci-db >&2
          exit 1

      - name: Start the container
        run: |
          docker run -d --name trader-ci --network trader-ci-net -p 8000:8000 \
            -e LLM_MOCK=true -e SIM_SEED=1234 \
            -e DATABASE_URL="postgresql://trader:trader@trader-ci-db:5432/trader" \
            trader:ci

      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health | grep -q '"status"'; then
              echo "Healthy:"
              curl -s http://localhost:8000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy. Logs:" >&2
          docker logs trader-ci >&2
          exit 1

      - name: Smoke the served app
        run: |
          set -euo pipefail
          # The frontend must actually be served, not just the API.
          curl -fsS http://localhost:8000/ | grep -qi "<!DOCTYPE html>"
          # And an API route must not be shadowed by the SPA fallback.
          curl -fsS http://localhost:8000/api/watchlist | grep -q "AAPL"

      - name: Container logs on failure
        if: failure()
        run: |
          echo "== trader-ci logs ==" >&2
          docker logs trader-ci >&2 || true
          echo "== trader-ci-db logs ==" >&2
          docker logs trader-ci-db >&2 || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Install Playwright browsers
        working-directory: test
        run: npx playwright install --with-deps chromium

      - name: Build and start the app
        run: |
          mkdir -p db
          docker compose -f test/docker-compose.test.yml up -d --build
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "App never became healthy. Logs:" >&2
          docker compose -f test/docker-compose.test.yml logs >&2
          exit 1

      - name: Run E2E tests
        working-directory: test
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/playwright-report/
          retention-days: 7

      - name: App logs on failure
        if: failure()
        run: docker compose -f test/docker-compose.test.yml logs
